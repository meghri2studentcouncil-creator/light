<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Մի փոքր լույս՝</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p.subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .play-btn {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }
    .play-btn:active {
      transform: scale(0.97);
    }
    audio {
      width: 100%;
      margin-top: 24px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Մի փոքր լույս՝</h1>
    <p class="subtitle">Ձեզ համար՝ սիրով։</p>

    <button class="play-btn" id="playBtn" onclick="playAudio()">
      ▶ Լսել
    </button>

    <audio id="myAudio" controls>
      <source src="light.m4a" type="audio/mp4">
      Ձեր բրաուզերը չի աջակցում աուդիո նվագարկումը։
    </audio>
  </div>

  <script>
    function playAudio() {
      var audio = document.getElementById('myAudio');
      var btn = document.getElementById('playBtn');
      audio.style.display = 'block';
      audio.play();
      btn.style.display = 'none';
    }
  </script>

</body>
</html>
